# Windows package of Flange Cutter: runs all tests, then build/build_windows.ps1 (the same script
# used on a laptop), and uploads the portable ZIP as an artifact. There is no installer.
#
# Code signing is optional. It runs only when these repository secrets exist:
#   CODESIGN_PFX_BASE64    the code signing certificate (.pfx file) as base64, for example from
#                          [Convert]::ToBase64String([IO.File]::ReadAllBytes("codesign.pfx"))
#   CODESIGN_PFX_PASSWORD  its password
# Without them (and always for pull requests from forks) the exe is built unsigned.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium for the UI test
        run: python -m playwright install chromium

      - name: Run the tests
        run: python -m pytest tests -q

      - name: Build the portable ZIP
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $signing = @{}
          if ($env:CODESIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            $signing = @{ CertificateFile = $pfx; CertificatePassword = $env:CODESIGN_PFX_PASSWORD }
          }
          try {
            ./build/build_windows.ps1 -Python (Get-Command python).Path @signing
          } finally {
            if ($signing.Count) { Remove-Item -LiteralPath $signing.CertificateFile -Force }
          }
          exit $LASTEXITCODE

      - name: Upload the portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: build/out/FlangeCutter-*-portable.zip
          archive: false
          if-no-files-found: error
